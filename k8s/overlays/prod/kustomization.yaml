apiVersion: kustomize.config.k8s.io/v1
kind: Kustomization

resources:
- ../../base

namePrefix: prod-

labels: 
  - pairs:
      environment: prod


patches:

- target:
    kind: Deployment
    name: frontend
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3


- target:
    kind: Deployment
    name: bff
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3


- target:
    kind: Deployment
    name: user-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3


- target:
    kind: Deployment
    name: message-service
  patch: |-
    - op: replace
      path: /spec/replicas
      value: 3